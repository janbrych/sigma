<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עולם המלפפונים</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Screen -->
    <div id="screen-main" class="screen active">
        <h1>מלפפון</h1>
        <div class="cucumber-wrapper">
            <img id="main-cucumber" src="https://upload.wikimedia.org/wikipedia/commons/e/ed/Cucumber_and_cross_section.jpg" alt="מלפפון">
            <div id="menu-container"></div>
        </div>
        <div class="stats">
            <span>זרעי מלפפון: <span id="seed-count">0</span></span>
        </div>
    </div>

    <!-- Video Screen -->
    <div id="screen-video" class="screen">
        <button class="back-btn">חזור</button>
        <h1>ריקוד מלפפונים</h1>
        <div class="video-selection" id="video-list">
            <!-- Video buttons will be injected here -->
        </div>
        <div class="video-container">
            <iframe id="video-iframe" width="560" height="315" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Game 1: Catch -->
    <div id="screen-catch" class="screen">
        <button class="back-btn">חזור</button>
        <h1>תפוס את המלפפון הנופל</h1>
        <div id="catch-game-container">
            <canvas id="catch-canvas"></canvas>
            <div class="game-ui">תוצאה: <span id="catch-score">0</span></div>
        </div>
    </div>

    <!-- Game 2: Gaza -->
    <div id="screen-gaza" class="screen">
        <button class="back-btn">חזור</button>
        <h1>מלפפון עזה</h1>
        <div id="gaza-game-container">
            <div id="gaza-background"></div>
            <div id="plane">✈️</div>
            <div id="gaza-instructions">לחץ על המקש הרווח להפלת מלפפון</div>
        </div>
    </div>

    <!-- Shop Screen -->
    <div id="screen-shop" class="screen">
        <button class="back-btn">חזור</button>
        <h1>חנות ירקות</h1>
        <div class="shop-items">
            <div class="shop-item" data-item="eggplant" data-price="50">
                <span class="item-icon">🍆</span>
                <span>חציל (50 זרעים)</span>
                <button class="buy-btn">קנה</button>
            </div>
            <div class="shop-item" data-item="carrot" data-price="30">
                <span class="item-icon">🥕</span>
                <span>גזר (30 זרעים)</span>
                <button class="buy-btn">קנה</button>
            </div>
        </div>
    </div>

    <!-- Social Credit Screen -->
    <div id="screen-social" class="screen">
        <button class="back-btn">חזור</button>
        <h1>אשראי חברתי מהמנהיג העליון</h1>
        <div class="social-credit-content">
            <div class="leader-portrait">
                <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&q=80&w=300" alt="Leader" style="border-radius: 50%; border: 5px solid #166534;">
            </div>
            <div id="netanyahu-quote" class="quote-box"></div>
            <button id="praise-btn" class="praise-button">הלל לנתניהו</button>
        </div>
        <div id="confetti-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
